services:
  frontend-test:
    build:
      context: ./frontend-test
    container_name: personnel-frontend-test
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      VITE_API_BASE_URL: http://localhost:4000/api
    ports:
      - "5174:5174"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5174"]
      interval: 10s
      timeout: 5s
      retries: 12
