services:
  gateway:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: /api
    container_name: personnel-gateway
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 128M
    ports:
      - "${APP_HTTP_PORT:-8080}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/gateway-health"]
      interval: 10s
      timeout: 5s
      retries: 12

  backend:
    build:
      context: ./backend
    container_name: personnel-backend
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M

    env_file:
      - .env

    environment:
      NODE_ENV: production
      PORT: 4000

      APP_URL: ${APP_URL:-http://localhost:8080}
      CORS_EXTRA_ORIGINS: ${CORS_EXTRA_ORIGINS:-http://127.0.0.1:8080,http://localhost:5173,http://127.0.0.1:5173}

      APP_TIMEZONE: Asia/Colombo
      DB_TIMEZONE: "+05:30"
      TZ: Asia/Colombo

      DATABASE_URL: ${DATABASE_URL}
      # DB_HOST: ${DB_HOST}
      # DB_PORT: ${DB_PORT}
      # DB_NAME: ${DB_NAME}
      # DB_USER: ${DB_USER}
      # DB_PASSWORD: ${DB_PASSWORD}
      # DB_SSL: ${DB_SSL:-true}

      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: 8h

      SUPER_ADMIN_NAME: ${SUPER_ADMIN_NAME:-System Admin}
      SUPER_ADMIN_EMAIL: ${SUPER_ADMIN_EMAIL}
      SUPER_ADMIN_PASSWORD: ${SUPER_ADMIN_PASSWORD}

    ports:
      - "4000:4000"

    command: >
      sh -c "
      node dist/database/migrate.js &&
      node dist/database/seeders/seedSuperAdmin.js &&
      node dist/server.js
      "

    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4000/health"]
      interval: 10s
      timeout: 5s
      retries: 12

