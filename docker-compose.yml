services:
  mysql:
    image: mysql:8.4
    container_name: personnel-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: personnel_management
      MYSQL_USER: personnel_app
      MYSQL_PASSWORD: personnel_password
      MYSQL_ROOT_PASSWORD: root_password
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysql --protocol=TCP -h 127.0.0.1 -upersonnel_app -ppersonnel_password personnel_management -e 'SELECT 1' >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 12

  backend:
    build:
      context: ./backend
    container_name: personnel-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      NODE_ENV: development
      PORT: 4000
      APP_ORIGIN: http://localhost:5173
      APP_ORIGINS: http://localhost:5173,http://localhost:5174
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: personnel_management
      DB_USER: personnel_app
      DB_PASSWORD: personnel_password
      JWT_SECRET: local-development-secret
      JWT_EXPIRES_IN: 8h
      SUPER_ADMIN_NAME: System Admin
      SUPER_ADMIN_EMAIL: admin@example.com
      SUPER_ADMIN_PASSWORD: ChangeMe123!
    ports:
      - "4000:4000"
    command: sh -c "node dist/database/migrate.js && node dist/database/seeders/seedSuperAdmin.js && node dist/server.js"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4000/health"]
      interval: 10s
      timeout: 5s
      retries: 12

  frontend:
    build:
      context: ./frontend
    container_name: personnel-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      VITE_API_BASE_URL: http://localhost:4000/api
    ports:
      - "5173:5173"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5173"]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  mysql-data:
